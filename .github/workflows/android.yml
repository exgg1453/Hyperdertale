name: android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # The app name, application id and orientation live in
  # tools/android_configure.py, which edits the port's gradle.properties.
  LOVE_ANDROID_REF: "11.5a"

jobs:
  apk:
    name: build apk
    runs-on: ubuntu-latest
    # Needed to attach the APK to a release; without it the upload gets a 403.
    permissions:
      contents: write
    steps:
      - name: Check out the game
        uses: actions/checkout@v4
        with:
          path: game

      - name: Build hyperdertale.love
        run: |
          cd game
          zip -9 -r ../hyperdertale.love . \
            -x '.git/*' '.github/*' 'docs/*' 'dist/*' 'tools/*' 'packaging/*' '*.md' 'LICENSE' '.gitignore'
          unzip -l ../hyperdertale.love | grep -q ' main.lua$'

      - name: Check out the LOVE Android port
        run: |
          # Tags move slowly; fall back to the default branch if the pin is gone.
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            --branch "${LOVE_ANDROID_REF}" https://github.com/love2d/love-android.git port \
          || git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/love2d/love-android.git port

      - name: Embed the game
        run: |
          mkdir -p port/app/src/embed/assets
          cp hyperdertale.love port/app/src/embed/assets/game.love
          ls -la port/app/src/embed/assets

      - name: Configure the app
        run: |
          cd port
          python3 "${GITHUB_WORKSPACE}/game/tools/android_configure.py" .

      - name: Install the launcher icon
        run: |
          # The port declares android:icon="@drawable/love", so the launcher
          # icon is these five density buckets.
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            src="${GITHUB_WORKSPACE}/game/packaging/android/drawable-${density}/love.png"
            dest="port/app/src/main/res/drawable-${density}/love.png"
            cp "$src" "$dest"
            echo "installed $dest"
          done
          ls -la port/app/src/main/res/drawable-*/love.png

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licences
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Gradle build
        run: |
          cd port
          chmod +x gradlew
          # Task names have shifted between LOVE Android releases, so try the
          # known variants in order and stop at the first that exists.
          ./gradlew --no-daemon assembleEmbedNoRecordDebug \
            || ./gradlew --no-daemon assembleEmbedDebug \
            || ./gradlew --no-daemon assembleDebug

      - name: Collect the APK
        run: |
          mkdir -p out
          find port -name '*.apk' -path '*outputs*' -print -exec cp {} out/ \;

          # Gradle names the file after its build flavours
          # (app-embed-noRecord-debug.apk). This is what people download from a
          # release, so give it the game's name. The name is fixed rather than
          # versioned so each build replaces the last one on the rolling release.
          cd out
          index=0
          for f in *.apk; do
            index=$((index + 1))
            suffix=""
            [ "$index" -gt 1 ] && suffix="-${index}"
            mv "$f" "Hyperdertale-android${suffix}.apk"
          done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: hyperdertale-android
          path: out/*.apk
          if-no-files-found: error

      - name: Publish to the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # A tag publishes to that tag; the default branch keeps the rolling
          # "latest" pre-release current. Anything else builds but publishes
          # nothing.
          case "${GITHUB_REF}" in
            refs/tags/v*)
              tag="${GITHUB_REF_NAME}"
              title="Hyperdertale ${GITHUB_REF_NAME}"
              ;;
            *)
              if [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
                echo "${GITHUB_REF_NAME} is not the default branch; not publishing."
                exit 0
              fi
              tag="latest"
              title="Latest build"
              ;;
          esac

          # This job and the desktop one race each other, so whichever arrives
          # first creates the release. No "|| true" here: a failed upload must
          # fail the job rather than leave a release quietly missing the APK.
          gh release view "$tag" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1 \
            || gh release create "$tag" \
                 --repo "${GITHUB_REPOSITORY}" \
                 --target "${GITHUB_SHA}" \
                 --prerelease \
                 --title "$title" \
                 --notes "Build of ${GITHUB_SHA}."

          gh release upload "$tag" out/*.apk \
            --repo "${GITHUB_REPOSITORY}" --clobber
