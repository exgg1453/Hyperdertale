name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  LOVE_VERSION: "11.5"
  GAME_NAME: "Hyperdertale"
  BUNDLE_ID: "com.hyperdertale"

jobs:
  lint:
    name: lua syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4

      - name: Byte-compile every source file
        run: |
          failed=0
          while IFS= read -r file; do
            if ! luac5.4 -p "$file"; then
              echo "::error file=$file::syntax error"
              failed=1
            fi
          done < <(find . -name '*.lua' -not -path './.git/*')
          exit $failed

  package:
    name: .love package
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build hyperdertale.love
        run: |
          # A .love file is just a zip with main.lua at its root.
          zip -9 -r hyperdertale.love . \
            -x '.git/*' '.github/*' 'docs/*' 'dist/*' 'tools/*' 'packaging/*' '*.md' 'LICENSE' '.gitignore'
          unzip -l hyperdertale.love | head -20

      - name: Verify main.lua sits at the archive root
        run: unzip -l hyperdertale.love | grep -q ' main.lua$'

      - uses: actions/upload-artifact@v4
        with:
          name: hyperdertale-love
          path: hyperdertale.love
          if-no-files-found: error

  windows:
    name: windows exe
    runs-on: windows-latest
    needs: package
    steps:
      # Checkout first: it cleans the workspace, which would remove a
      # previously downloaded artifact.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hyperdertale-love

      - name: Fetch the LOVE runtime
        shell: bash
        run: |
          curl -fSL -o love-win64.zip \
            "https://github.com/love2d/love/releases/download/${LOVE_VERSION}/love-${LOVE_VERSION}-win64.zip"
          unzip -q love-win64.zip
          ls "love-${LOVE_VERSION}-win64"

      - name: Put the game icon and details on the executable
        shell: bash
        run: |
          curl -fSL -o rcedit.exe \
            "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe"

          version="0.1.0"
          case "${GITHUB_REF}" in
            refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;;
          esac

          # The icon has to go on before the game is appended: rcedit rewrites
          # the executable and would drop anything stuck on the end of it.
          exe="love-${LOVE_VERSION}-win64/love.exe"
          ./rcedit.exe "$exe" \
            --set-icon packaging/icon.ico \
            --set-version-string "ProductName" "${GAME_NAME}" \
            --set-version-string "FileDescription" "${GAME_NAME}" \
            --set-version-string "LegalCopyright" "${GAME_NAME} contributors" \
            --set-file-version "${version}.0" \
            --set-product-version "${version}.0"

      - name: Fuse the game onto love.exe
        shell: bash
        run: |
          runtime="love-${LOVE_VERSION}-win64"
          mkdir -p "dist/${GAME_NAME}"
          cat "$runtime/love.exe" hyperdertale.love > "dist/${GAME_NAME}/${GAME_NAME}.exe"
          # The DLLs next to the exe are what makes it runnable without an install.
          cp "$runtime"/*.dll "dist/${GAME_NAME}/"
          cp "$runtime"/license.txt "dist/${GAME_NAME}/LOVE-license.txt" || true
          ls -la "dist/${GAME_NAME}"

      - name: Zip the portable build
        shell: bash
        run: |
          cd dist && 7z a -tzip "../${GAME_NAME}-windows-x64.zip" "${GAME_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: hyperdertale-windows
          path: ${{ env.GAME_NAME }}-windows-x64.zip
          if-no-files-found: error

  macos:
    name: macos app
    runs-on: macos-latest
    needs: package
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hyperdertale-love

      - name: Fetch the LOVE runtime
        run: |
          curl -fSL -o love-macos.zip \
            "https://github.com/love2d/love/releases/download/${LOVE_VERSION}/love-${LOVE_VERSION}-macos.zip"
          unzip -q love-macos.zip
          ls love.app/Contents

      - name: Build the icon
        run: |
          # sips and iconutil ship with macOS, so the artwork needs no tooling
          # of its own here.
          mkdir -p icon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size packaging/icon.png \
              --out "icon.iconset/icon_${size}x${size}.png" > /dev/null
            sips -z $((size * 2)) $((size * 2)) packaging/icon.png \
              --out "icon.iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns icon.iconset -o GameIcon.icns
          ls -la GameIcon.icns

      - name: Build the app bundle
        run: |
          # On launch the runtime looks for any .love in Resources
          # (pathForResource:nil ofType:@"love") and runs it instead of showing
          # the "no game" screen.
          cp hyperdertale.love love.app/Contents/Resources/game.love

          version="0.1.0"
          case "${GITHUB_REF}" in
            refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;;
          esac

          plist="love.app/Contents/Info.plist"
          buddy=/usr/libexec/PlistBuddy
          "$buddy" -c "Set :CFBundleIdentifier ${BUNDLE_ID}" "$plist"
          "$buddy" -c "Set :CFBundleName ${GAME_NAME}" "$plist"
          "$buddy" -c "Set :CFBundleShortVersionString ${version}" "$plist"
          "$buddy" -c "Set :NSHumanReadableCopyright Hyperdertale contributors. LOVE (c) LOVE Development Team." "$plist"

          # CFBundleIconFile already points at GameIcon; swap the artwork in.
          cp GameIcon.icns love.app/Contents/Resources/GameIcon.icns
          "$buddy" -c "Set :CFBundleIconFile GameIcon" "$plist"
          "$buddy" -c "Delete :CFBundleIconName" "$plist" || true

          # Without these the game would register itself as the system handler
          # for every .love file on the machine.
          "$buddy" -c "Delete :CFBundleDocumentTypes" "$plist" || true
          "$buddy" -c "Delete :UTExportedTypeDeclarations" "$plist" || true

          mv love.app "${GAME_NAME}.app"
          "$buddy" -c "Print :CFBundleIdentifier" "${GAME_NAME}.app/Contents/Info.plist"
          "$buddy" -c "Print :CFBundleName" "${GAME_NAME}.app/Contents/Info.plist"

      - name: Sign the bundle ad-hoc
        run: |
          # Editing the bundle invalidates the signature it shipped with, and
          # Apple Silicon refuses to run unsigned code at all, so re-sign it.
          # Frameworks have to be signed before the bundle that contains them.
          codesign --force --deep --sign - "${GAME_NAME}.app"
          codesign --verify --deep --strict --verbose=2 "${GAME_NAME}.app"

      - name: Package the disk image
        run: |
          hdiutil create -volname "${GAME_NAME}" -srcfolder "${GAME_NAME}.app" \
            -ov -format UDZO "${GAME_NAME}-macOS.dmg"
          ls -la "${GAME_NAME}-macOS.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: hyperdertale-macos
          path: ${{ env.GAME_NAME }}-macOS.dmg
          if-no-files-found: error

  linux:
    name: linux appimage
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hyperdertale-love

      - name: Fetch the LOVE AppImage and appimagetool
        run: |
          curl -fSL -o love.AppImage \
            "https://github.com/love2d/love/releases/download/${LOVE_VERSION}/love-${LOVE_VERSION}-x86_64.AppImage"
          curl -fSL -o appimagetool \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x love.AppImage appimagetool

          # --appimage-extract always writes into ./squashfs-root, so each one
          # is unpacked from its own directory to keep the two apart.
          mkdir -p love-src tool
          (cd love-src && ../love.AppImage --appimage-extract > /dev/null)
          (cd tool && ../appimagetool --appimage-extract > /dev/null)

      - name: Fuse the game into the AppImage payload
        run: |
          payload=love-src/squashfs-root
          cat "$payload/bin/love" hyperdertale.love > fused
          mv fused "$payload/bin/love"
          chmod +x "$payload/bin/love"

          # The desktop entry still described the LOVE engine, hid itself from
          # menus and claimed .love files; it describes this game now.
          desktop="$payload/love.desktop"
          sed -i "s/^Name=.*/Name=${GAME_NAME}/" "$desktop"
          sed -i "s|^Comment=.*|Comment=An Undertale-inspired fan game|" "$desktop"
          sed -i "s/^Icon=.*/Icon=hyperdertale/" "$desktop"
          sed -i "/^NoDisplay=/d; /^MimeType=/d" "$desktop"
          sed -i "s/^Categories=.*/Categories=Game;/" "$desktop"
          cat "$desktop"

          # .DirIcon is a symlink to the LOVE logo; replace both it and the
          # icon the desktop entry names.
          rm -f "$payload/.DirIcon" "$payload/love.svg"
          cp assets/icon.png "$payload/hyperdertale.png"
          cp assets/icon.png "$payload/.DirIcon"

          ARCH=x86_64 ./tool/squashfs-root/AppRun "$payload" "${GAME_NAME}-x86_64.AppImage"
          ls -la "${GAME_NAME}-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: hyperdertale-linux
          path: ${{ env.GAME_NAME }}-x86_64.AppImage
          if-no-files-found: error

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: [windows, macos, linux]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.zip' -o -name '*.love' -o -name '*.AppImage' \
            -o -name '*.dmg' -o -name '*.apk' \) \
            -exec cp {} release/ \;
          ls -la release

      - name: Work out where this build publishes
        id: target
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # A tag publishes to that tag and stays put. Every push to the default
          # branch refreshes one rolling "latest" pre-release, so the newest
          # build of all four platforms is always downloadable without tagging.
          case "${GITHUB_REF}" in
            refs/tags/v*)
              echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
              echo "rolling=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              if [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
                echo "${GITHUB_REF_NAME} is not the default branch; not publishing."
                echo "tag=" >> "$GITHUB_OUTPUT"
              else
                echo "tag=latest" >> "$GITHUB_OUTPUT"
              fi
              echo "rolling=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Publish
        if: steps.target.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
          ROLLING: ${{ steps.target.outputs.rolling }}
        run: |
          if [ "$ROLLING" = "true" ]; then
            notes=$(printf 'Automatic build of the newest commit.\n\nCommit: %s\n\nThis pre-release is replaced by every push. For a fixed version, see the tagged releases.' "${GITHUB_SHA}")
            title="${GAME_NAME} (latest build)"
          else
            notes=""
            title="${GAME_NAME} ${TAG}"
          fi

          if ! gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            if [ "$ROLLING" = "true" ]; then
              gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" \
                --target "${GITHUB_SHA}" --prerelease \
                --title "$title" --notes "$notes"
            else
              gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" \
                --title "$title" --generate-notes
            fi
          elif [ "$ROLLING" = "true" ]; then
            # Drag the tag and the notes onto this commit so "latest" means it.
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
              -f sha="${GITHUB_SHA}" -F force=true > /dev/null
            gh release edit "$TAG" --repo "${GITHUB_REPOSITORY}" --notes "$notes"
          fi

          gh release upload "$TAG" release/* --repo "${GITHUB_REPOSITORY}" --clobber
          gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" --json assets \
            --jq '.assets[] | "  \(.name)  \(.size)"' 
